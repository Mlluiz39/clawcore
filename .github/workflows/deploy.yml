name: CI + Deploy VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# PRs só rodam o gate (verify). Push em main roda o gate e só então deploya.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-backend:
    name: Backend · typecheck + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      # O gate: um commit quebrado nunca chega na VPS.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes offline (sem rede / sem API)
        run: npm run test:offline

  verify-frontend:
    name: Frontend · typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Testes (sanitização de Markdown)
        working-directory: frontend
        run: npm test

      - name: Build (tsc -b + vite build)
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy na VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify-backend, verify-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd ~/clawcore

            if [ ! -f .env ]; then
              echo "ERRO: .env ausente no servidor (copie .env.example e preencha)."
              exit 1
            fi

            git pull --ff-only

            # Sobe a stack e aguarda os healthchecks (backend + frontend)
            docker compose up -d --build --remove-orphans --wait --wait-timeout 300

            # Verificação extra de ponta a ponta: API respondendo pelo container
            docker compose exec -T backend wget -qO- http://127.0.0.1:8080/api/health

            echo "Deploy OK"
