services:
  backend:
    build: .
    container_name: clawcore_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD:-}
    # Permite que o container alcance serviços rodando na máquina host
    # (ex: OPENAI_BASE_URL=http://host.docker.internal:30128/v1)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data                      # SQLite persists
      - ./.agents/skills:/app/.agents/skills  # Hot-reload skills
      - ./tmp:/app/tmp                        # Temp files
      - ./outputs:/app/outputs                # Generated files
      - ~/.config/gogcli:/root/.config/gogcli # Gogcli credentials
    # Sem porta publicada: só o nginx (frontend) conversa com a API.
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clawcore_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # Só exposto internamente — o Caddy faz o proxy externo (TLS)
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Borda pública: TLS automático (Let's Encrypt) + proxy para o frontend
  caddy:
    image: caddy:2-alpine
    container_name: clawcore_caddy
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      - "SITE_DOMAIN=${SITE_DOMAIN:?SITE_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # certificados Let's Encrypt
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
